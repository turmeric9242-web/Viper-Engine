name: build-windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: |
          mkdir dist
          copy build\Release\viper.exe dist\
          copy README.md dist\
          copy PARITY.md dist\
          xcopy /E /I /Y scenes dist\scenes
          xcopy /E /I /Y scripts dist\scripts
          xcopy /E /I /Y assets dist\assets
          xcopy /E /I /Y market dist\market
      - uses: actions/upload-artifact@v4
        with:
          name: ViperEngine-v0.4-windows
          path: dist
